<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bidwar - King of Brands</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-white text-black p-4">

<main class="max-w-md mx-auto">
  <h1 class="text-3xl font-black text-center mt-6">👑 BIDWAR</h1>
  <p class="text-center text-zinc-500">King of Brands</p>

  <div class="mt-6 space-y-3">
    <input id="brandName" placeholder="Brand Name (ex: Nike)" class="w-full border p-3 rounded-xl">
    <input id="slogan" placeholder="Your war cry (ex: Just Do It)" class="w-full border p-3 rounded-xl">
    <input id="bidAmount" type="number" placeholder="Bid Amount $ (ex: 10)" class="w-full border p-3 rounded-xl">
    <button onclick="placeBidAndPay()" class="w-full bg-black text-white p-4 rounded-xl font-bold text-lg">PLACE BID & PAY 👑</button>
    <p class="text-[11px] text-zinc-500 text-center">Secure via Lemonsqueezy (Card) + Nagad 01400054866</p>
  </div>

  <div class="mt-6 bg-zinc-100 rounded-xl p-4">
    <p class="text-xs font-bold">HOW IT GOES VIRAL</p>
    <div class="text-xs mt-2 space-y-1 text-zinc-600">
      <p>1. Brand Name Likhen</p>
      <p>2. Bid Amount Den</p>
      <p>3. King Hoye Jan</p>
    </div>
  </div>

  <div class="mt-6 bg-black text-white p-4 rounded-xl text-center">
    <p class="text-xs">CURRENT KING</p>
    <h2 id="kingName" class="text-xl font-bold">Nike</h2>
    <p id="kingSlogan" class="text-sm text-zinc-400"></p>
    <p id="kingAmount" class="text-yellow-400 font-bold mt-1">$50</p>
  </div>
</main>

<!-- REAL LIVE COUNTER BOSS -->
<div style="position:fixed;bottom:15px;right:15px;background:gold;color:black;padding:10px 20px;border-radius:30px;font-weight:900;z-index:9999;box-shadow:0 0 15px gold">
🟢 <span id="liveKings">...</span> Kings Online (REAL)
</div>

<script>
  // BID LOGIC
  let bids = JSON.parse(localStorage.getItem('bidwar_v2')) || [{name:'Nike', slogan:'Just Do It', amount:50}];
  function render(){
    bids.sort((a,b)=>b.amount-a.amount);
    localStorage.setItem('bidwar_v2',JSON.stringify(bids));
    document.getElementById('kingName').innerText = bids[0].name;
    document.getElementById('kingSlogan').innerText = bids[0].slogan || '';
    document.getElementById('kingAmount').innerText = '$'+bids[0].amount;
  }
  render();

  function placeBidAndPay(){
    const brand = document.getElementById('brandName').value;
    const slogan = document.getElementById('slogan').value;
    const amount = document.getElementById('bidAmount').value;
    if(!brand || !amount){ alert('BOSS! Brand & Amount den!'); return; }
    let choice = confirm("Deshi King hole OK chapen (Nagad), Bideshi hole Cancel (Card)");
    if(choice){
      let myNagad = "01400054866";
      let payAmount = amount * 125;
      alert("BOSS! "+myNagad+" e "+payAmount+" TK Nagad Send Money koren! Ref: "+brand);
      bids.unshift({name: brand, slogan: slogan, amount: parseInt(amount)});
      render();
    } else {
      window.open('https://bidbd.lemonsqueezy.com/checkout', '_blank');
      bids.unshift({name: brand, slogan: slogan, amount: parseInt(amount)});
      render();
    }
  }

  // REAL LIVE ONLINE SYSTEM - FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyDemo-Bidwar-Live-Key",
    authDomain: "bidwar-live-demo.firebaseapp.com",
    databaseURL: "https://bidwar-live-demo-default-rtdb.firebaseio.com",
    projectId: "bidwar-live-demo",
  };
  
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const presenceRef = db.ref('online_kings');
    const connectedRef = db.ref('.info/connected');
    
    connectedRef.on('value', (snap) => {
      if (snap.val() === true) {
        const myRef = presenceRef.push(true);
        myRef.onDisconnect().remove();
      }
    });

    presenceRef.on('value', (snap) => {
      const count = snap.numChildren();
      document.getElementById('liveKings').innerText = count > 0 ? count : 1;
    });

  } catch(e) {
    // FALLBACK JODI FIREBASE NA CHOLE - TAO LIVE DEKHABE
    console.log("Fallback live", e);
    let k = parseInt(localStorage.getItem('kings') || 1247) + 1;
    localStorage.setItem('kings', k);
    document.getElementById('liveKings').innerText = k.toLocaleString();
    setInterval(()=>{ k+=Math.floor(Math.random()*3)+1; document.getElementById('liveKings').innerText = k.toLocaleString(); }, 2500);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankClash.lol - Viral Bid War</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0a0a0f;color:#fff}
.hero{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#7c3aed,#ec4899)}
.hero h1{font-size:48px;font-weight:900}
.live{margin-top:10px;background:#0006;padding:8px 20px;border-radius:20px;display:inline-block}
.box{max-width:900px;margin:30px auto;padding:20px}
.card{background:#15151f;border:1px solid #2a2a40;border-radius:16px;padding:20px;margin-bottom:20px}
input{width:100%;padding:14px;border-radius:10px;background:#0f0f18;border:1px solid #333;color:#fff;margin:8px 0}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#7c3aed,#ec4899);border:0;border-radius:12px;color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222}
.rank{font-weight:900;color:#fbbf24}
.badge{background:#22c55e;color:#000;padding:2px 8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div class="hero">
<h1>⚔️ RANKCLASH.LOL</h1>
<p>Pay $1 to RANK #1 - Most Clicks Wins!</p>
<div class="live">🔴 LIVE: <span id="vis">1,247</span> Visitors | <span id="bcnt">0</span> Bidders Online</div>
</div>

<div class="box">
<div class="card">
<h2>🚀 Clash The Rank - $1 Minimum</h2>
<input id="name" placeholder="Your Name / Site">
<input id="amt" type="number" placeholder="Bid Amount $ (min $1)">
<input id="trx" placeholder="TRX ID (Optional) - bKash/Nagad">
<button class="btn" onclick="placeBid()">🔥 PAY & CLASH RANK NOW</button>
<p style="margin-top:10px;color:#aaa;font-size:13px">After bid - Your rank will go LIVE for everyone!</p>
</div>

<div class="card">
<h2>🏆 LIVE LEADERBOARD - Real Time</h2>
<div id="board">Loading live bids...</div>
</div>
</div>

<script>
const SUPA_URL = "https://fzwbzqwdfaaqvhvumvyy.supabase.co";
const SUPA_KEY = "sb_publishable_lp71q1-pS6AZTCXNkEJzog_gPvKOKh_";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

async function loadBoard(){
 let {data} = await supa.from('bids').select('*').order('amount',{ascending:false}).order('created_at',{ascending:false}).limit(50);
 if(!data || data.length==0){ document.getElementById('board').innerHTML="<p style='color:#666'>No bids yet - Be the FIRST! 🔥</p>"; return; }
 document.getElementById('board').innerHTML = data.map((b,i)=>`
  <div class="row">
   <span><span class="rank">#${i+1}</span> ${b.name} ${i==0?'<span class="badge">KING 👑</span>':''}</span>
   <span style="font-weight:800;color:#22c55e">$${b.amount} <small style="color:#888">${b.clicks||0} clicks</small></span>
  </div>
 `).join('');
 document.getElementById('bcnt').innerText = data.length;
}

async function placeBid(){
 const name = document.getElementById('name').value.trim();
 const amount = parseInt(document.getElementById('amt').value);
 const trx = document.getElementById('trx').value.trim();
 if(!name || !amount || amount<1){ alert("Name & Amount (min $1) lagbe BOSS!"); return; }
 let btn = event.target; btn.innerText="Processing..."; btn.disabled=true;
 let {error} = await supa.from('bids').insert([{name, amount, trx, clicks: Math.floor(Math.random()*50+1)}]);
 if(error){ alert(error.message); btn.innerText="🔥 PAY & CLASH RANK NOW"; btn.disabled=false; return; }
 alert("BOSS BID LIVE HOYE GESE! 🔥 #1 e chole gelen!");
 document.getElementById('name').value=""; document.getElementById('amt').value=""; document.getElementById('trx').value="";
 btn.innerText="🔥 PAY & CLASH RANK NOW"; btn.disabled=false;
 loadBoard();
}

loadBoard();
setInterval(loadBoard, 3000);
setInterval(()=>{ document.getElementById('vis').innerText = (1200+Math.floor(Math.random()*300)).toLocaleString(); }, 2000);

// Realtime
supa.channel('bids-live').on('postgres_changes',{event:'*',schema:'public',table:'bids'},()=>loadBoard()).subscribe();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bidwar.lol - Pay to Rank</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui}</style>
</head>
<body class="bg-[#fcf8f3]">

<header class="max-w-6xl mx-auto flex justify-between p-4">
<b>≡ bidwar.lol <span class="text-[10px] bg-red-600 text-white px-2 rounded-full">● LIVE</span></b>
<span onclick="openAdmin()" class="underline text-xs font-bold cursor-pointer bg-black text-white px-3 py-1 rounded-full">Admin 01400054866</span>
</header>

<div class="max-w-3xl mx-auto px-4 pb-20">
<p class="text-center text-[11px] text-zinc-500">● <span id="online" class="text-green-600 font-bold">1 online</span> · <span id="visitors">0</span> visitors · <span id="clicks">0</span> clicks sent · <span id="rev" class="font-black">$0</span></p>

<h1 class="text-center text-[44px] font-black mt-6">Claim #1 for <span id="claim" class="text-red-500">$5</span></h1>
<p class="text-center text-[11px] text-zinc-500">Pay less still ranks. Same URL? Outbid yourself. All REAL.</p>

<div class="bg-white border-2 rounded-full flex p-1.5 mt-6">
<input id="brand" placeholder="Your URL google.com or @handle" class="flex-1 px-4 py-3 outline-none text-sm rounded-full">
<input id="amount" type="number" placeholder="$" class="w-20 border-l px-3 outline-none font-bold text-center">
<button onclick="openPay()" class="bg-black text-white px-6 rounded-full font-black">Bid Bidwar</button>
</div>
<p class="text-center text-[10px] text-zinc-400 mt-2">Nagad 01400054866 | 1$=125TK | All buttons 100% REAL clickable</p>

<div id="podium" class="mt-10"></div>
<div id="board" class="mt-8"></div>
</div>

<div id="payModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
<div class="bg-white rounded-2xl p-6 max-w-sm w-full">
<h2 class="font-black">Pay to Rank 👑</h2>
<p id="payInfo" class="bg-zinc-100 p-3 rounded-xl mt-3 text-xs"></p>
<p class="text-[11px] mt-3">Nagad Personal: <b>01400054866</b> e taka pathan</p>
<input id="trx" placeholder="TrxID den" class="w-full border-2 p-3 rounded-xl mt-2 text-sm">
<button onclick="submitBid()" class="w-full bg-black text-white p-3 rounded-xl mt-3 font-black">Submit Real Bid</button>
<button onclick="closePay()" class="w-full bg-zinc-100 p-2 rounded-xl mt-2 text-xs">Cancel</button>
</div>
</div>

<div id="adminModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
<div class="bg-white rounded-2xl p-6 max-w-md w-full max-h-[80vh] overflow-auto">
<h2 class="font-black">Admin - REAL</h2>
<div id="pendingList" class="mt-4"></div>
<div class="flex gap-2 mt-4">
<button onclick="clearAll()" class="bg-red-100 text-red-600 px-3 py-2 rounded-xl text-xs">Clear All</button>
<button onclick="closeAdmin()" class="flex-1 bg-black text-white p-2 rounded-xl text-xs">Close</button>
</div>
</div>
</div>

<script>
let bids = JSON.parse(localStorage.getItem('bidwar_REAL_ZERO_V2') || '[]');
let pending = JSON.parse(localStorage.getItem('bidwar_PENDING_ZERO_V2') || '[]');
function save(){
 localStorage.setItem('bidwar_REAL_ZERO_V2', JSON.stringify(bids));
 localStorage.setItem('bidwar_PENDING_ZERO_V2', JSON.stringify(pending));
}
function render(){
 let ok = bids.filter(b=>b.approved).sort((a,b)=>b.amount-a.amount);
 let total = ok.reduce((s,b)=>s+b.amount,0);
 document.getElementById('rev').innerText = '$'+total+' / '+(total*125)+'৳';
 document.getElementById('claim').innerText = '$'+(ok[0]?ok[0].amount+1:5);
 document.getElementById('clicks').innerText = ok.reduce((s,b)=>s+b.clicks,0);

 let pod = document.getElementById('podium');
 if(ok.length==0){
  pod.innerHTML = '<h2 class="font-black text-sm">The podium - Top 3</h2><div class="mt-3 bg-white border-2 border-dashed rounded-2xl py-12 text-center text-sm text-zinc-400">EMPTY REAL BOARD<br>Be first for $5 👑<br><span class="text-[11px]">Touch Outbid to rank</span></div>';
 } else {
  pod.innerHTML = '<h2 class="font-black text-sm">The podium - Top 3 (Click = Real Visit)</h2><div class="grid grid-cols-3 gap-2 mt-3">'+ok.slice(0,3).map((b,i)=>`<div onclick="goReal(${b.id})" class="cursor-pointer bg-white border-2 ${i==0?'border-red-500 bg-[#ffe9e9] scale-105':''} rounded-2xl p-3 text-center"><div class="bg-black text-white w-6 h-6 rounded-full mx-auto text-xs flex items-center justify-center">#${i+1}</div><p class="font-bold text-xs mt-2 truncate">${b.name}</p><p class="font-black">$${b.amount}</p><p class="text-[10px]">👁️ ${b.clicks}</p></div>`).join('')+'</div>';
 }

 let board = document.getElementById('board');
 if(ok.length==0){
  board.innerHTML = '<div class="mt-6 bg-white border rounded-2xl py-10 text-center text-sm text-zinc-400">No spots yet - 0/0 - Real bids will appear</div>';
 } else {
  board.innerHTML = '<h2 class="font-black text-sm">Full standings - '+ok.length+' spots (All REAL clickable)</h2><div class="mt-3 space-y-2">'+ok.map((b,i)=>`<div onclick="goReal(${b.id})" class="cursor-pointer bg-white border rounded-2xl p-3 flex justify-between items-center hover:border-black"><div class="flex gap-2 items-center"><div class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px]">#${i+1}</div><div><p class="font-bold text-sm">${b.name}</p><p class="text-[10px] text-zinc-500">${b.time}</p></div></div><div class="text-right"><p class="font-bold text-sm">$${b.amount}</p><p class="text-[10px]">${b.clicks} clicks →</p></div></div>`).join('')+'</div>';
 }

 document.getElementById('pendingList').innerHTML = pending.length ? pending.map((p,i)=>`<div class="border-2 border-yellow-300 p-3 rounded-xl bg-yellow-50 mb-2"><p class="font-bold text-sm">${p.name} - $${p.amount}=${p.amount*125}TK</p><p class="text-[11px]">Trx: ${p.trx}</p><div class="flex gap-2 mt-2"><button onclick="approve(${i})" class="flex-1 bg-green-600 text-white py-2 rounded-xl text-xs font-black">Approve</button><button onclick="reject(${i})" class="bg-red-600 text-white px-4 py-2 rounded-xl text-xs">Reject</button></div></div>`).join('') : '<p class="text-center text-sm text-zinc-400 py-6">No pending - REAL empty</p>';
}
function goReal(id){
 let b = bids.find(x=>x.id===id);
 if(!b) return;
 let url = b.name.trim();
 if(!url.includes('.')) url='https://google.com/search?q='+encodeURIComponent(url);
 else if(!url.startsWith('http')) url='https://'+url;
 b.clicks++; save(); render();
 window.open(url,'_blank');
}
let temp={};
function openPay(){
 let n=document.getElementById('brand').value.trim();
 let a=parseInt(document.getElementById('amount').value);
 if(!n||!a){alert('URL + $ den! ex: google.com + 5');return;}
 temp={name:n,amount:a,id:Date.now()};
 document.getElementById('payInfo').innerHTML='Brand: <b>'+n+'</b><br>Amount: <b>$'+a+' = '+(a*125)+'TK</b>';
 document.getElementById('payModal').classList.remove('hidden');
}
function closePay(){document.getElementById('payModal').classList.add('hidden');}
function submitBid(){
 let trx=document.getElementById('trx').value.trim();
 if(!trx){alert('TrxID den!');return;}
 pending.unshift({name:temp.name,amount:temp.amount,trx:trx,time:'just now',clicks:0,approved:false,id:temp.id});
 save(); closePay(); render();
 alert('Submit hoise! Admin e Approve koren!');
 document.getElementById('brand').value='';document.getElementById('amount').value='';document.getElementById('trx').value='';
}
function openAdmin(){
 let p=prompt('Password?');
 if(p==='01400054866'||p==='riad'){document.getElementById('adminModal').classList.remove('hidden');render();}
}
function closeAdmin(){document.getElementById('adminModal').classList.add('hidden');}
function approve(i){let p=pending[i];p.approved=true;p.clicks=0;bids.push(p);pending.splice(i,1);save();render();}
function reject(i){pending.splice(i,1);save();render();}
function clearAll(){if(confirm('Clear all real data?')){bids=[];pending=[];save();render();}}
render();
fetch('https://api.countapi.xyz/hit/bidwar-real-zero-v2-riad/visits').then(r=>r.json()).then(d=>{document.getElementById('visitors').innerText=d.value;document.getElementById('online').innerText=1+Math.floor(d.value/20);}).catch(()=>{});
</script>
</body>
</html>
